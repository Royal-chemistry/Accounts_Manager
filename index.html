<!doctype html>
<html lang="en-IN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- This policy makes the browser itself block the app from sending data to any other server.
       The trailing semicolon matters: some antivirus products append to this value, which would otherwise break the last rule. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none';">
  <meta name="referrer" content="no-referrer">
  <title>Accounts Manager</title>
  <meta name="description" content="Free, private accounts for small businesses: payroll, GST invoices, stock, payables and reports. Runs entirely in your browser.">
  <meta name="theme-color" content="#2B4BC4">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="assets/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/pages.css">
  <link rel="stylesheet" href="css/print.css">
  <script src="js/theme-init.js"></script>
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <div id="app"></div>
  <div id="print-root"></div>
  <noscript><p>Accounts Manager needs JavaScript to run. All your data stays in this browser.</p></noscript>
</body>
</html>
